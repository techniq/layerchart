name: Upload Preview Deployment

# Deploys what `Build Preview Deployment` produced.
#
# That build runs on `pull_request`, where a fork's code is untrusted and secrets are withheld.
# This workflow runs on `workflow_run`, which is why it can see the Cloudflare credentials — and
# why it must not run anything out of the fork beyond the built Worker itself.  In particular the
# Wrangler config comes from a fresh checkout of the base repository, never from the artifact: it
# names the Worker and declares its bindings, so taking the fork's copy would let a pull request
# redirect the deploy or ask for bindings it should not have.
on:
  workflow_run:
    workflows: [Build Preview Deployment]
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Base repo, not the pull request — only for `docs/wrangler.toml`
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # Lands the build where `docs/wrangler.toml` expects it: `main` and `assets.directory` are
      # resolved relative to the config file
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-build
          path: docs/.svelte-kit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read the pull request number
        id: pr
        run: echo "number=$(cat docs/.svelte-kit/pr-number)" >> "$GITHUB_OUTPUT"

      # Uploads a version without promoting it to the active deployment, so production is
      # untouched.  `--preview-alias` gives the version a stable hostname per pull request rather
      # than a per-version hash: `pr-123-layerchart.<subdomain>.workers.dev`.
      #
      # Aliases must start with a lowercase letter and may only contain lowercase letters, numbers
      # and dashes — hence the `pr-` prefix.
      #
      # Wrangler is resolved the same way as in `deploy-prod` — keep the two in step.
      - name: Upload preview version
        id: upload
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          NPM_CONFIG_MIN_RELEASE_AGE: 7
        run: |
          # `pipefail` so a failed upload is not masked by `tee`'s exit status
          set -euo pipefail

          alias="pr-${{ steps.pr.outputs.number }}"
          npx --yes --prefix "$RUNNER_TEMP" wrangler@4 versions upload --preview-alias "$alias" 2>&1 | tee upload.log

          # Match the alias we just asked for.  The output also carries the per-version URL, so
          # taking the first `workers.dev` match would be a coin flip between them.
          url=$(grep -oE "https://${alias}-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::No preview URL for '$alias' in the upload output" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL on the pull request
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = '<!-- preview-deployment -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const body = [
              marker,
              '### Preview deployment',
              '',
              `${process.env.PREVIEW_URL}`,
              '',
              `Built from ${context.payload.workflow_run.head_sha.slice(0, 7)}.`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
