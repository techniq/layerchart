name: Update Generated Files

# Files generated from `main` and kept out of feature PRs so those stay reviewable:
#
# - the example catalog (`docs/src/examples/catalog`) and screenshots (`docs/static/screenshots`)
# - the bundle size baseline (`bundle-analyzer/bundle-reports/latest.json`) PRs compare against
# - the visual regression baseline (`docs/snapshots/baseline.json`) PRs compare against
#
# Each is regenerated by its own job, in parallel, and the results land in one PR.  A job only runs
# when its inputs changed since the last successful run (rather than in this push, so a push whose
# run was cancelled or failed isn't missed).  The PR is rewritten from `main` each time, so a part
# whose job didn't run (or failed) is carried over from the open PR rather than dropped.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - packages/**
      - docs/src/examples/**
      - docs/scripts/visual-snapshot.mjs
      - bundle-analyzer/**
      - .github/workflows/update-generated.yml
      # What the PR this opens changes, so merging it shouldn't run this again
      - '!docs/src/examples/catalog/**'
      - '!bundle-analyzer/bundle-reports/**'

# A newer push regenerates everything, so it supersedes a run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each job hands its changes to `pull-request` as a binary patch against the commit they all
# checked out, rather than the files themselves (the screenshots directory alone is >100MB).  The
# patch also carries deletions.  An empty patch means nothing changed.
jobs:
  changes:
    name: Find What Needs Regenerating
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To find the last successful run
      actions: read
    outputs:
      catalog: ${{ steps.changes.outputs.catalog }}
      bundle: ${{ steps.changes.outputs.bundle }}
      visual: ${{ steps.changes.outputs.visual }}
    steps:
      - uses: actions/checkout@v4

      # Everything is regenerated when run by hand, on the first run, or when this workflow changed
      - name: Compare with the last successful run
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set_all() {
            echo "Regenerating everything: $1"
            printf 'catalog=true\nbundle=true\nvisual=true\n' >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT" = workflow_dispatch ]; then set_all 'started by hand'; exit 0; fi

          base=$(gh run list --workflow update-generated.yml --branch main --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty')
          if [ -z "$base" ] || ! git fetch -q --depth=1 origin "$base"; then set_all 'no earlier successful run'; exit 0; fi

          # Leave out what this workflow generates
          changed=$(git diff --name-only "$base" HEAD |
            grep -Ev '^(docs/src/examples/catalog|bundle-analyzer/bundle-reports)/' || true)
          echo "Changed since $base:"; echo "$changed"
          if grep -qFx '.github/workflows/update-generated.yml' <<< "$changed"; then set_all 'workflow changed'; exit 0; fi

          has() { grep -Eq "$1" <<< "$changed" && echo true || echo false; }
          {
            echo "catalog=$(has '^(docs/src/examples/|packages/[^/]+/src/lib/components/)')"
            echo "bundle=$(has '^(packages/layerchart/|bundle-analyzer/)')"
            echo "visual=$(has '^(packages/|docs/src/examples/|docs/scripts/visual-snapshot\.mjs$)')"
          } | tee -a "$GITHUB_OUTPUT"

  catalog-and-screenshots:
    name: Example Catalog and Screenshots
    needs: changes
    if: needs.changes.outputs.catalog == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The catalog's `createdAt` / `updatedAt` come from each example's git history
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Build packages
        run: pnpm build:packages

      - name: Generate catalog
        run: pnpm --filter docs generate:catalog

      # A production build rather than `vite dev`: every page is served already compiled, so the
      # screenshot generator's 5s page timeout isn't spent on Vite transforming modules for the
      # first pages it loads.  `prebuild` also generates the inputs the server needs (ex. the
      # gitignored `stackblitz-files.json`).
      - name: Build docs
        run: pnpm --filter docs build
        env:
          # `generate:releases` only reads public releases, which `GITHUB_TOKEN` covers
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the docs server
        run: |
          pnpm --filter docs exec vite preview --port 3002 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "http://localhost:3002/docs/screenshot/AnnotationLine/horizontal" && exit 0
            sleep 2
          done
          echo "docs server did not start"; cat /tmp/server.log; exit 1

      # Incremental: only examples whose source changed (per the checksums in `index.json`) are
      # captured again
      - name: Generate screenshots
        run: pnpm --filter docs generate:screenshots
        env:
          BASE_URL: http://localhost:3002

      - name: Save changes
        run: |
          mkdir -p /tmp/generated
          git add -A docs/src/examples/catalog docs/static/screenshots
          git diff --cached --binary > /tmp/generated/catalog-and-screenshots.patch

      - uses: actions/upload-artifact@v4
        with:
          name: generated-catalog-and-screenshots
          path: /tmp/generated/catalog-and-screenshots.patch
          retention-days: 1

  bundle-baseline:
    name: Bundle Size Baseline
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Run bundle analysis
        run: pnpm bundle:analyze

      # The report always carries a new `timestamp`, which on its own isn't a change worth a PR
      - name: Save changes
        run: |
          mkdir -p /tmp/generated
          report=bundle-analyzer/bundle-reports/latest.json
          if [ ! -f "$report" ]; then
            echo "No report generated"
            git checkout -- "$report" 2>/dev/null || true
          elif git cat-file -e "HEAD:$report" 2>/dev/null &&
            [ "$(git show "HEAD:$report" | jq -S 'del(.timestamp)')" = "$(jq -S 'del(.timestamp)' "$report")" ]; then
            echo "Only the timestamp changed"
            git checkout -- "$report"
          fi
          git add -A "$report"
          git diff --cached --binary > /tmp/generated/bundle-baseline.patch

      - uses: actions/upload-artifact@v4
        with:
          name: generated-bundle-baseline
          path: /tmp/generated/bundle-baseline.patch
          retention-days: 1

  # Fingerprints depend on the rendering environment, so the baseline PRs compare against has to be
  # recorded on a runner rather than a contributor's machine, from a production build like
  # visual-regression.yml captures.
  visual-baseline:
    name: Visual Baseline
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Build packages
        run: pnpm build:packages

      # A production build rather than `vite dev`, which serves each page as hundreds of separate
      # modules — capturing every example is ~2.5x faster against the build.  `prebuild` also
      # generates the inputs the server needs (ex. the gitignored `stackblitz-files.json`).
      - name: Build docs
        run: pnpm --filter docs build
        env:
          # `generate:releases` only reads public releases, which `GITHUB_TOKEN` covers
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the docs server
        run: |
          pnpm --filter docs exec vite preview --port 3002 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "http://localhost:3002/docs/screenshot/AnnotationLine/horizontal" && exit 0
            sleep 2
          done
          echo "docs server did not start"; cat /tmp/server.log; exit 1

      # A full capture takes a while, so prove the app renders at all before spending it.
      # `capture` exits non-zero once more than a few examples draw nothing.
      - name: Smoke test the docs server
        working-directory: docs
        run: node scripts/visual-snapshot.mjs capture /tmp/smoke.json --filter AnnotationLine --repeat 1

      # Two passes so examples that are still nondeterministic are recorded as such and skipped
      # by later comparisons rather than reported as regressions
      - name: Capture baseline
        working-directory: docs
        run: node scripts/visual-snapshot.mjs capture snapshots/baseline.json --repeat 2

      - name: Save changes
        run: |
          mkdir -p /tmp/generated
          git add -A docs/snapshots/baseline.json
          git diff --cached --binary > /tmp/generated/visual-baseline.patch

      - uses: actions/upload-artifact@v4
        with:
          name: generated-visual-baseline
          path: /tmp/generated/visual-baseline.patch
          retention-days: 1

  pull-request:
    name: Create or Update PR
    needs: [changes, catalog-and-screenshots, bundle-baseline, visual-baseline]
    # One job failing (or not needing to run) shouldn't hold back the others' updates.  With nothing
    # to regenerate the open PR (if any) is already current, so it's left alone.
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (needs.changes.outputs.catalog == 'true' || needs.changes.outputs.bundle == 'true' ||
      needs.changes.outputs.visual == 'true')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: generated-*
          path: /tmp/generated
          merge-multiple: true

      # A part whose job didn't run had no inputs change since the last successful run, so what the
      # open PR has for it is still current; one whose job failed keeps what the PR had before.
      # Either way its files are copied over from the PR.
      - name: Apply changes
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/update-generated
          CATALOG_RESULT: ${{ needs.catalog-and-screenshots.result }}
          BUNDLE_RESULT: ${{ needs.bundle-baseline.result }}
          VISUAL_RESULT: ${{ needs.visual-baseline.result }}
        run: |
          pr_open=false
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" != 0 ]; then
            git fetch -q --depth=1 origin "$BRANCH" && pr_open=true
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          summary=""
          apply() { # <patch name> <job result> <description> <paths>...
            local name=$1 result=$2 description=$3; shift 3
            local patch="/tmp/generated/$name.patch"
            if [ "$result" = success ]; then
              [ -s "$patch" ] && git apply --binary "$patch"
            elif [ "$pr_open" = true ]; then
              # No overlay: files the PR deleted are deleted here too
              git restore --source=FETCH_HEAD --worktree -- "$@"
            fi
            local changed=false
            [ -n "$(git status --porcelain -- "$@")" ] && changed=true

            if [ "$result" = failure ]; then
              local kept=""; [ "$changed" = true ] && kept=", kept from the previous update"
              summary+="- ⚠️ $description: **failed to regenerate**$kept (see the [run]($run_url))"$'\n'
            elif [ "$changed" = false ]; then
              summary+="- $description: unchanged"$'\n'
            elif [ "$result" = success ]; then
              summary+="- $description: updated"$'\n'
            else
              summary+="- $description: updated (by an earlier run, its inputs haven't changed since)"$'\n'
            fi
          }
          apply catalog-and-screenshots "$CATALOG_RESULT" 'Example catalog and screenshots' \
            docs/src/examples/catalog docs/static/screenshots
          apply bundle-baseline "$BUNDLE_RESULT" 'Bundle size baseline' \
            bundle-analyzer/bundle-reports/latest.json
          apply visual-baseline "$VISUAL_RESULT" 'Visual regression baseline' \
            docs/snapshots/baseline.json
          {
            echo 'summary<<EOF'
            printf '%s' "$summary"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # With nothing changed, this closes an open PR (and deletes its branch) since `main` is
      # already current
      - name: Create or update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-generated
          delete-branch: true
          title: 'chore: update example catalog, screenshots and baselines'
          body: |
            Regenerated from `main` (${{ github.sha }}):

            ${{ steps.apply.outputs.summary }}
            ### How to review

            - **Catalog and screenshots** (`docs/src/examples/catalog`, `docs/static/screenshots`):
              catalog changes should match the examples that changed.  Screenshots are only captured
              for examples whose source changed, so check the new `.webp` files look right.
            - **Bundle size baseline** (`bundle-analyzer/bundle-reports/latest.json`): size changes
              should line up with recently merged PRs, with no unexpected increases.
            - **Visual baseline** (`docs/snapshots/baseline.json`): one line per example.  Lines that
              changed mean the example draws something different than the last baseline — check
              those were intended.

            _Opened by the Update Generated Files workflow._
          commit-message: 'chore: update example catalog, screenshots and baselines'
          add-paths: |
            docs/src/examples/catalog
            docs/static/screenshots
            bundle-analyzer/bundle-reports/latest.json
            docs/snapshots/baseline.json
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
