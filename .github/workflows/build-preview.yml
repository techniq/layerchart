name: Build Preview Deployment

# cancel in-progress runs on new commits to same PR (github.event.number)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm package

      - name: Build site
        run: pnpm --filter docs build
        env:
          GITHUB_API_TOKEN: ${{ secrets.GH_API_TOKEN }}

      # `deploy-preview` names the preview after the PR, but it runs on `workflow_run`, where
      # `workflow_run.pull_requests` is empty for pull requests opened from a fork — the case this
      # split exists to serve.  Carry the number across in the artifact instead.
      #
      # Written beside `cloudflare/` rather than inside it, so it is not published as a static asset.
      - name: Record the pull request number
        run: echo "${{ github.event.number }}" > docs/.svelte-kit/pr-number

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: docs/.svelte-kit
          include-hidden-files: true
