# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI

on:
  push:
    branches: ['main']
    # Generated files the bot PR from `update-generated.yml` changes.  Nothing here builds,
    # tests or packages them, so a PR (or merge) touching only these has nothing to check — and
    # skipping it means that PR doesn't wait on approval to run this
    paths-ignore:
      - docs/src/examples/catalog/**
      - docs/static/screenshots/**
      - docs/snapshots/**
      - bundle-analyzer/bundle-reports/**
  pull_request:
    paths-ignore:
      - docs/src/examples/catalog/**
      - docs/static/screenshots/**
      - docs/snapshots/**
      - bundle-analyzer/bundle-reports/**
      # What the Version Packages PR from `release.yml` changes.  A dependency change in
      # `package.json` comes with `pnpm-lock.yaml`, which still runs this; any other
      # `package.json`-only change is checked on `main` once merged
      - .changeset/**
      - packages/*/CHANGELOG.md
      - packages/*/package.json

env:
  NODE_VERSION: 24.x

jobs:
  lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:packages
      - run: pnpm lint:packages
        if: ${{ !cancelled() }}

  test-server-ssr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests (server + ssr)
        run: pnpm --filter layerchart test:unit --project server --project ssr
        env:
          CI: true

  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter layerchart exec playwright install chromium
      - name: Run browser tests (client)
        run: pnpm --filter layerchart test:unit --project client
        env:
          CI: true

  # test-docs-server-ssr:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4.0.0
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #         cache: pnpm
  #     - run: pnpm install --frozen-lockfile
  #     - name: Run docs unit tests (server + ssr)
  #       run: pnpm --filter docs test:unit --project server --project ssr
  #       env:
  #         CI: true

  # test-docs-browser:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4.0.0
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #         cache: pnpm
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm --filter docs exec playwright install chromium
  #     - name: Run docs browser tests (client)
  #       run: pnpm --filter docs test:unit --project client
  #       env:
  #         CI: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm build:examples
      # Run after building to ensure svelte-package is ran
      - run: pnpm check:examples
      - run: pnpm lint:examples
        if: ${{ !cancelled() }}
