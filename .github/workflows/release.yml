name: Release

on:
  push:
    branches:
      - main
      - next

permissions: {}
jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'techniq/layerchart'
    permissions:
      contents: write # to create release (changesets/action)
      pull-requests: write # to create pull request (changesets/action)
      id-token: write # to publish to npm via OIDC trusted publishing
      actions: write # to start the docs deploy once published
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish: pnpm changeset:release
          version: pnpm changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The docs read release notes from GitHub at build time, so redeploy once they exist.  A
      # `release` trigger can't do this: releases created with `GITHUB_TOKEN` don't start other
      # workflows, but `workflow_dispatch` is exempt.
      - name: Deploy the docs with the new release notes
        if: steps.changesets.outputs.published == 'true' && github.ref_name == 'main'
        run: gh workflow run deploy-prod.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
